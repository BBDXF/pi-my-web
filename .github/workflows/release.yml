name: CI / Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web deps
        run: npm ci --prefix web
      - name: Install pi (peer dependency, for tests)
        run: npm install --no-save @earendil-works/pi-coding-agent
      - name: Test
        run: npm test
      - name: Build web UI
        run: npm run build
      - name: Pack
        run: |
          mkdir -p out
          npm pack --ignore-scripts --pack-destination out
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: pi-my-web-package
          path: out/*.tgz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pi-my-web-package
          path: out
      - name: Check tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
          cp out/pi-my-web-$v.tgz out/pi-my-web.tgz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME}
          notes=$(awk -v ver="${v#v}" '$0 ~ "^## " {p = index($0, ver) > 0; next} p' CHANGELOG.md)
          cat > notes.md <<EOF
          ${notes}

          ## Install

          \`\`\`bash
          # as a pi extension (/gui, /web)
          pi install npm:https://github.com/${GITHUB_REPOSITORY}/releases/download/${v}/pi-my-web.tgz
          # standalone daemon (bin: pi-my-web)
          npm i -g https://github.com/${GITHUB_REPOSITORY}/releases/download/${v}/pi-my-web.tgz
          \`\`\`
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$v" out/*.tgz --title "pi-my-web $v" --notes-file notes.md
